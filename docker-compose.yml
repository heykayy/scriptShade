services:
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      # OAuth must return through the published nginx port. The backend
      # port is intentionally internal to the Docker network.
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    # No DB_PATH or volume needed — data lives on Turso, not the local filesystem.
    # For local dev without Turso, the server falls back to an in-memory SQLite db.
    restart: unless-stopped
    expose:
      - "8787"

  web:
    build:
      context: .
      args:
        VITE_API_BASE: ""   # empty => same-origin /api, proxied by nginx to the `server` service
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
